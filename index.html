<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">

<div class="login-container">
  <div class="login-card">

    <img src="ICTPROJLOGO.png" class="logo" alt="ICT Logo">

    <h2>Login</h2>

        <details ontoggle="alert('LOGIN CREDENTIALS: \nStudent ID: 2026-0001 \nPass: 12345 \nSection: 9-Sapphire')">
            <summary class="btn2 btn-sm btn-outline-secondary mb-3">View Login Help</summary>
            <p class="small text-muted">Enter the credentials shown in the alert box.</p>
        </details>

    <form>

      <input type="number" id="StudentID" class="form-control mb-3" placeholder="Student ID">
      <input type="password" id="Password" class="form-control mb-3" placeholder="Password">
      <input type="text" id="Section" class="form-control mb-3" placeholder="Section">
      <button class="btn login-btn w-100" type="button" onclick="login()">LOGIN</button>
      <br><br><br><br>

    </form>

  </div>
</div>

</body>

<script src="proj.js"></script>
</body>
</html>
